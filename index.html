<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mga apo sa taga tangbo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* ---------- CSS Variables for Theming ---------- */
        :root {
            --bg: #fcfcfc;
            --bg-elevated: #ffffff;
            --text: #1d1d1f;
            --muted: #86868b;
            --line: rgba(0, 0, 0, 0.08);
            --gap: 12px;
            --tile-bg: #f5f5f7;
            --btn-bg: #1d1d1f;
            --btn-text: #ffffff;
            --overlay: rgba(252, 252, 252, 0.85);
            --shadow: rgba(0, 0, 0, 0.06);
            --glass-blur: blur(20px);
            --radius: 12px;
        }

        body.dark {
            --bg: #000000;
            --bg-elevated: #1c1c1e;
            --text: #f5f5f7;
            --muted: #86868b;
            --line: rgba(255, 255, 255, 0.1);
            --tile-bg: #1c1c1e;
            --btn-bg: #f5f5f7;
            --btn-text: #000000;
            --overlay: rgba(0, 0, 0, 0.85);
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 300;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .hidden {
            display: none !important;
        }

        /* ---------- splash screen & app entrance ---------- */
        .splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s, background-color 0.5s ease;
        }

        .splash.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash h1 {
            margin: 0;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--text);
            opacity: 0;
            transform: translateY(12px);
            animation: splashReveal 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            text-align: center;
            padding: 0 20px;
        }

        @keyframes splashReveal {
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-content {
            opacity: 0;
            transform: scale(0.98) translateY(10px);
            filter: blur(8px);
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1),
                transform 1.4s cubic-bezier(0.16, 1, 0.3, 1),
                filter 1.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-content.visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            filter: blur(0);
        }

        /* ---------- header ---------- */
        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            padding: 0 24px;
            background: var(--overlay);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--line);
            transition: background-color 0.5s ease, border-color 0.5s ease;
        }

        header h1 {
            margin: 0;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        #themeToggle {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #themeToggle:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        #themeToggle svg {
            width: 20px;
            height: 20px;
        }

        #burger {
            width: 32px;
            height: 32px;
            padding: 0;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }

        #burger span {
            display: block;
            width: 22px;
            height: 1px;
            background: var(--text);
            transition: background-color 0.5s ease;
        }

        /* ---------- burger menu ---------- */
        #menu {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 30;
            width: 290px;
            padding: 80px 32px 32px;
            background: var(--bg-elevated);
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 4px;
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.5s ease, border-color 0.5s ease;
            box-shadow: 10px 0 30px var(--shadow);
        }

        #menu.open {
            transform: translateX(0);
        }

        #closeMenu {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text);
            font-size: 32px;
            font-weight: 200;
            cursor: pointer;
        }

        .menu-label {
            margin: 26px 0 8px;
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
        }

        #menu .item {
            text-align: left;
            padding: 12px 16px;
            margin-left: -16px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
        }

        #menu .item:hover {
            color: var(--text);
            background: rgba(134, 134, 139, 0.1);
        }

        #menu .item.active {
            color: var(--text);
            background: rgba(134, 134, 139, 0.15);
        }

        #backdrop {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: var(--overlay);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #backdrop.show {
            opacity: 1;
            pointer-events: auto;
        }

        /* ---------- content ---------- */
        main {
            padding: 0 var(--gap) 120px;
            max-width: 1800px;
            margin: 0 auto;
        }

        h2 {
            margin: 64px 0 32px;
            text-align: center;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--text);
        }

        /* ---------- cover photo hero ---------- */
        .hero {
            position: relative;
            width: 100%;
            height: 45vh;
            min-height: 350px;
            max-height: 600px;
            border-radius: 20px;
            overflow: hidden;
            margin: 24px 0 48px;
            box-shadow: 0 20px 40px var(--shadow);
            transform: translateZ(0);
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            animation: slowPan 25s infinite alternate ease-in-out;
        }

        @keyframes slowPan {
            0% {
                transform: scale(1.02) translateY(0);
            }

            100% {
                transform: scale(1.08) translateY(-2%);
            }
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.2) 40%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            pointer-events: none;
        }

        .hero-title {
            color: #ffffff;
            font-size: 26px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin: 0 0 8px 0;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .hero-subtitle {
            color: rgba(255, 255, 255, 0.85);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin: 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .featured-row {
            display: flex;
            gap: var(--gap);
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 20px;
        }

        .featured-row::-webkit-scrollbar {
            display: none;
        }

        /* ---------- timeline view ---------- */
        .timeline-header {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text);
            margin: 48px 0 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }

        .gallery {
            column-count: 4;
            column-gap: var(--gap);
        }

        @media (max-width: 1200px) {
            .gallery {
                column-count: 3;
            }
        }

        @media (max-width: 800px) {
            .gallery {
                column-count: 2;
            }
        }

        /* ---------- tiles ---------- */
        .tile {
            position: relative;
            overflow: hidden;
            display: block;
            break-inside: avoid;
            margin-bottom: var(--gap);
            background: var(--tile-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 15px var(--shadow);
            animation: fade 0.6s ease both;
            transform: translateZ(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .tile:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px var(--shadow);
        }

        .tile img,
        .tile video {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
            transition: transform 0.5s ease;
        }

        .tile:hover img,
        .tile:hover video {
            transform: scale(1.03);
        }

        .tile.big {
            flex: 0 0 auto;
            height: 460px;
            margin-bottom: 0;
            border-radius: var(--radius);
        }

        .tile.big img,
        .tile.big video {
            height: 100%;
            width: auto;
            max-width: 88vw;
            object-fit: cover;
        }

        .tile::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.4), transparent 30%, transparent 70%, rgba(0, 0, 0, 0.5));
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            border-radius: var(--radius);
        }

        .tile:hover::after {
            opacity: 1;
        }

        .tile .title {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 16px;
            z-index: 2;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .tile:hover .title {
            opacity: 1;
            transform: translateY(0);
        }

        .tile .badge {
            position: absolute;
            left: 16px;
            top: 16px;
            z-index: 2;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            background: rgba(0, 0, 0, 0.4);
            padding: 4px 8px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
        }

        .tools {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 3;
            display: flex;
            gap: 6px;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .tile:hover .tools {
            opacity: 1;
            transform: translateY(0);
        }

        .tools button {
            width: 34px;
            height: 34px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 50%;
            border: none;
            color: #ffffff;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tools button:hover {
            transform: scale(1.1);
            background: rgba(0, 0, 0, 0.7);
        }

        @media (hover: none) {

            .tools,
            .tile .title {
                opacity: 1;
                transform: translateY(0);
            }

            .tile::after {
                opacity: 1;
            }
        }

        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg {
            color: var(--muted);
            font-size: 13px;
            margin: 4px 0;
            line-height: 1.5;
        }

        .empty {
            text-align: center;
            padding: 100px 0;
            column-span: all;
            font-size: 14px;
            letter-spacing: 0.05em;
        }

        /* ---------- Pill Upload FAB ---------- */
        .fab {
            position: fixed;
            bottom: 40px;
            right: 40px;
            z-index: 40;
            height: 64px;
            width: auto;
            padding: 0 28px;
            border-radius: 32px;
            background: var(--text);
            color: var(--bg);
            border: none;
            box-shadow: 0 10px 30px var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.5s ease;
        }

        .fab:hover {
            transform: scale(1.05) translateY(-4px);
        }

        .fab svg {
            width: 24px;
            height: 24px;
        }

        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--overlay);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            color: var(--text);
            padding: 16px 32px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            box-shadow: 0 15px 40px var(--shadow);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* ---------- lightbox ---------- */
        #lightbox {
            background: var(--bg);
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.4s ease;
        }

        #lbContent {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        #lbContent img,
        #lbContent video {
            display: block;
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 20px 50px var(--shadow);
            animation: lbZoom 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes lbZoom {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #lbTitle {
            position: absolute;
            bottom: 30px;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text);
            background: var(--overlay);
            backdrop-filter: var(--glass-blur);
            padding: 10px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 30px var(--shadow);
        }

        #lbClose,
        .lbNav {
            position: absolute;
            background: var(--overlay);
            backdrop-filter: var(--glass-blur);
            border: none;
            color: var(--text);
            font-weight: 300;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px var(--shadow);
        }

        #lbClose {
            top: 24px;
            right: 24px;
            width: 50px;
            height: 50px;
            font-size: 32px;
        }

        .lbNav {
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            font-size: 40px;
        }

        #lbClose:hover {
            transform: scale(1.1);
        }

        .lbNav:hover {
            transform: translateY(-50%) scale(1.1);
        }

        #lbPrev {
            left: 24px;
        }

        #lbNext {
            right: 24px;
        }

        /* ---------- small screens ---------- */
        @media (max-width: 600px) {
            :root {
                --gap: 8px;
            }

            header {
                padding: 0 16px;
                height: 60px;
            }

            header h1 {
                font-size: 10px;
                letter-spacing: 0.1em;
            }

            .hero {
                height: 35vh;
                margin: 16px 0 32px;
                border-radius: 16px;
            }

            .hero-overlay {
                padding: 24px;
            }

            .hero-title {
                font-size: 18px;
            }

            h2 {
                margin: 40px 0 20px;
            }

            .tile.big {
                height: 280px;
            }

            .lbNav {
                display: none;
            }

            #lbClose {
                top: 16px;
                right: 16px;
                width: 40px;
                height: 40px;
                font-size: 24px;
            }

            #lbTitle {
                bottom: 20px;
            }

            .fab {
                bottom: 24px;
                right: 24px;
                height: 56px;
                padding: 0 20px;
                font-size: 12px;
                gap: 8px;
            }

            .fab svg {
                width: 20px;
                height: 20px;
            }

            .toast {
                bottom: 100px;
                padding: 12px 24px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- SPLASH SCREEN -->
    <div id="splash" class="splash">
        <h1>mga apo sa taga tangbo</h1>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-content" class="app-content">
        <header>
            <button id="burger" aria-label="Menu">
                <span></span><span></span><span></span>
            </button>
            <h1>mga apo sa taga tangbo</h1>
            <div class="header-actions">
                <button id="themeToggle" aria-label="Toggle Theme">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="icon-moon">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </header>

        <main>
            <!-- COVER PHOTO HERO -->
            <section id="heroCover" class="hero">
                <img src="DSC06435.jpg" alt="mga apo sa taga tangbo Cover Photo">
                <div class="hero-overlay">
                    <h1 class="hero-title">mga apo sa taga tangbo</h1>
                    <p class="hero-subtitle">Memories & Moments</p>
                </div>
            </section>

            <section id="featuredSection" class="hidden">
                <h2>Featured Collection</h2>
                <div id="featuredRow" class="featured-row"></div>
            </section>

            <section>
                <h2 id="galleryTitle">All Memories</h2>
                <div id="galleryContainer"></div>
                <p id="empty" class="msg empty hidden">Tap the Upload button to add your first memory.</p>
            </section>
        </main>
    </div>

    <!-- EXPLICIT PILL UPLOAD FAB -->
    <button id="fabUpload" class="fab" aria-label="Upload Memories">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span>Upload</span>
    </button>
    <input type="file" id="autoFileInput" multiple accept="image/*,video/*" class="hidden">

    <!-- UPLOAD TOAST NOTIFICATION -->
    <div id="toast" class="toast">Adding memories...</div>

    <!-- FIXED OVERLAYS -->
    <div id="backdrop"></div>
    <nav id="menu">
        <button id="closeMenu">&times;</button>
        <p class="menu-label">Browse</p>
        <button class="item active" data-view="home">Home</button>
        <button class="item" data-view="featured">Featured</button>
        <button class="item" data-view="photos">Photos</button>
        <button class="item" data-view="videos">Videos</button>
        <p class="menu-label">Manage</p>
        <button class="item" id="menuUploadBtn">Add New</button>
    </nav>

    <!-- LIGHTBOX -->
    <div id="lightbox" class="hidden">
        <button id="lbClose">&times;</button>
        <button id="lbPrev" class="lbNav">&#8249;</button>
        <div id="lbContent"></div>
        <button id="lbNext" class="lbNav">&#8250;</button>
        <p id="lbTitle"></p>
    </div>

    <script>
        var db = null;
        var items = [];
        var shown = [];
        var currentView = "home";
        var lbIndex = 0;
        var loadStartTime = Date.now();
        var isAppRevealed = false;

        function $(id) { return document.getElementById(id); }

        // ---------- Theme Setup ----------
        const themeToggle = $('themeToggle');
        const body = document.body;

        const sunIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
        const moonIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

        function updateThemeIcon() {
            themeToggle.innerHTML = body.classList.contains('dark') ? sunIcon : moonIcon;
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            body.classList.add('dark');
        }
        updateThemeIcon();

        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark');
            updateThemeIcon();
            localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
        });

        // ---------- Smooth Entrance ----------
        function revealApp() {
            if (isAppRevealed) return;
            isAppRevealed = true;

            var timeElapsed = Date.now() - loadStartTime;
            var minSplashTime = 1600;
            var delay = Math.max(0, minSplashTime - timeElapsed);

            setTimeout(function () {
                $("splash").classList.add("hide");
                $("app-content").classList.add("visible");
            }, delay);
        }

        // ---------- Database (IndexedDB) ----------
        function openDB(callback) {
            var request = indexedDB.open("familyGallery", 1);
            request.onupgradeneeded = function () {
                request.result.createObjectStore("items", { keyPath: "id" });
            };
            request.onsuccess = function () {
                db = request.result;
                callback();
            };
            request.onerror = function () {
                alert("Could not open storage. Try a normal (non-private) browser window.");
            };
        }

        function getAllItems(callback) {
            var req = db.transaction("items", "readonly").objectStore("items").getAll();
            req.onsuccess = function () { callback(req.result); };
        }

        function saveItem(item, callback) {
            var tx = db.transaction("items", "readwrite");
            tx.objectStore("items").put(item);
            tx.oncomplete = function () { if (callback) callback(); };
        }

        function removeItem(id, callback) {
            var tx = db.transaction("items", "readwrite");
            tx.objectStore("items").delete(id);
            tx.oncomplete = function () { if (callback) callback(); };
        }

        // ---------- Auto-load the Specific Pickleball Photos ----------
        async function loadInitialPhotos() {
            const defaultFiles = [
                { title: "Pickleball Serve", url: "DSC06313 (1).jpg", type: "image" },
                { title: "Ready Position", url: "DSC06337.jpg", type: "image" },
                { title: "Court Smiles", url: "DSC06348.jpg", type: "image" },
                { title: "In Action", url: "DSC06356.jpg", type: "image" },
                { title: "The Swing", url: "DSC06395.jpg", type: "image" }
            ];

            for (let i = 0; i < defaultFiles.length; i++) {
                try {
                    let response = await fetch(defaultFiles[i].url);
                    if (!response.ok) continue; // Skip gracefully if file isn't in folder yet

                    let blob = await response.blob();
                    let offsetMs = i * 60 * 60 * 1000;

                    let item = {
                        id: "initial-" + Date.now() + "-" + i,
                        title: defaultFiles[i].title,
                        type: defaultFiles[i].type,
                        featured: false,
                        date: Date.now() - offsetMs,
                        blob: blob,
                        thumbnail: null
                    };
                    await new Promise(resolve => saveItem(item, resolve));
                } catch (err) {
                    console.error("Failed to load: " + defaultFiles[i].title, err);
                }
            }
            loadItems(false);
        }

        // ---------- Load & Render ----------
        function loadItems(isInitialLoad = false) {
            getAllItems(function (list) {
                // Trigger auto-load for the specific provided files if gallery is totally empty
                if (list.length === 0 && isInitialLoad) {
                    loadInitialPhotos();
                    return;
                }

                list.sort(function (a, b) { return b.date - a.date; });

                for (var i = 0; i < list.length; i++) {
                    list[i].url = URL.createObjectURL(list[i].blob);
                }
                for (var j = 0; j < items.length; j++) {
                    URL.revokeObjectURL(items[j].url);
                }

                items = list;
                render();
            });
        }

        function makeButton(text, title, onclick) {
            var b = document.createElement("button");
            b.textContent = text;
            b.title = title;
            b.onclick = function (e) {
                e.stopPropagation();
                onclick();
            };
            return b;
        }

        function makeTile(item, big) {
            var tile = document.createElement("div");
            tile.className = big ? "tile big" : "tile";

            var media;
            if (item.type === "video") {
                media = document.createElement("video");
                media.src = item.url;
                if (item.thumbnail) {
                    media.poster = item.thumbnail;
                } else {
                    media.src = item.url + "#t=0.5";
                }
                media.preload = "metadata";
                media.muted = true;
                media.loop = true;
                media.playsInline = true;

                tile.addEventListener("mouseenter", function () {
                    media.play().catch(function () { });
                });
                tile.addEventListener("mouseleave", function () {
                    media.pause();
                    media.currentTime = 0;
                });

            } else {
                media = document.createElement("img");
                media.src = item.url;
                media.loading = "lazy";
            }
            media.onclick = function () { openLightbox(item.id); };
            tile.appendChild(media);

            if (item.type === "video") {
                var badge = document.createElement("span");
                badge.className = "badge";
                badge.textContent = "Video";
                tile.appendChild(badge);
            }

            var tools = document.createElement("div");
            tools.className = "tools";

            var starBtn = makeButton(item.featured ? "★" : "☆", "Feature / unfeature", function () { toggleFeature(item); });
            var renameBtn = makeButton("✎", "Rename", function () { renameItem(item); });
            var delBtn = makeButton("✕", "Delete", function () { deleteItem(item); });

            tools.appendChild(starBtn);
            tools.appendChild(renameBtn);
            tools.appendChild(delBtn);
            tile.appendChild(tools);

            var title = document.createElement("div");
            title.className = "title";
            title.textContent = item.title;
            tile.appendChild(title);

            return tile;
        }

        function render() {
            var container = $("galleryContainer");
            var row = $("featuredRow");
            container.innerHTML = "";
            row.innerHTML = "";
            shown = [];
            var featuredItems = [];

            for (var i = 0; i < items.length; i++) {
                var it = items[i];
                if (it.featured) featuredItems.push(it);

                if (currentView === "home") shown.push(it);
                else if (currentView === "photos" && it.type === "image") shown.push(it);
                else if (currentView === "videos" && it.type === "video") shown.push(it);
                else if (currentView === "featured" && it.featured) shown.push(it);
            }

            var titles = {
                home: "All Memories",
                photos: "Photos",
                videos: "Videos",
                featured: "Featured Collection"
            };
            $("galleryTitle").textContent = titles[currentView];

            if (currentView === "home") {
                $("heroCover").classList.remove("hidden");
            } else {
                $("heroCover").classList.add("hidden");
            }

            if (currentView === "home" && featuredItems.length > 0) {
                $("featuredSection").classList.remove("hidden");
                for (var j = 0; j < featuredItems.length; j++) {
                    row.appendChild(makeTile(featuredItems[j], true));
                }
            } else {
                $("featuredSection").classList.add("hidden");
            }

            var groupedByDate = {};
            for (var k = 0; k < shown.length; k++) {
                var itemToGroup = shown[k];
                var dateObj = new Date(itemToGroup.date);
                var monthYearStr = dateObj.toLocaleDateString('default', { month: 'long', year: 'numeric' });

                if (!groupedByDate[monthYearStr]) {
                    groupedByDate[monthYearStr] = [];
                }
                groupedByDate[monthYearStr].push(itemToGroup);
            }

            for (var groupName in groupedByDate) {
                var groupWrapper = document.createElement("div");

                var header = document.createElement("h3");
                header.className = "timeline-header";
                header.textContent = groupName;
                groupWrapper.appendChild(header);

                var grid = document.createElement("div");
                grid.className = "gallery";

                var groupItems = groupedByDate[groupName];
                for (var m = 0; m < groupItems.length; m++) {
                    grid.appendChild(makeTile(groupItems[m], false));
                }

                groupWrapper.appendChild(grid);
                container.appendChild(groupWrapper);
            }

            if (shown.length === 0) {
                $("empty").classList.remove("hidden");
            } else {
                $("empty").classList.add("hidden");
            }

            revealApp();
        }

        // ---------- Item Actions ----------
        function toggleFeature(item) {
            item.featured = !item.featured;
            saveItem(toSaveable(item), loadItems);
        }

        function renameItem(item) {
            var t = prompt("Rename memory:", item.title);
            if (t === null) return;
            t = t.trim();
            if (t === "") return;
            item.title = t;
            saveItem(toSaveable(item), loadItems);
        }

        function deleteItem(item) {
            if (!confirm("Are you sure you want to delete \"" + item.title + "\"?")) return;
            removeItem(item.id, loadItems);
        }

        function toSaveable(item) {
            return {
                id: item.id, title: item.title, type: item.type,
                featured: item.featured, date: item.date, blob: item.blob,
                thumbnail: item.thumbnail || null
            };
        }

        // ---------- Burger Menu ----------
        function openMenu() {
            $("menu").classList.add("open");
            $("backdrop").classList.add("show");
        }

        function closeMenu() {
            $("menu").classList.remove("open");
            $("backdrop").classList.remove("show");
        }

        function setView(view) {
            currentView = view;
            var buttons = document.querySelectorAll("#menu .item");
            for (var i = 0; i < buttons.length; i++) {
                if (buttons[i].getAttribute("data-view")) {
                    if (buttons[i].getAttribute("data-view") === view) buttons[i].classList.add("active");
                    else buttons[i].classList.remove("active");
                }
            }
            render();
            window.scrollTo(0, 0);
        }

        $("burger").onclick = openMenu;
        $("closeMenu").onclick = closeMenu;
        $("backdrop").onclick = closeMenu;

        var menuButtons = document.querySelectorAll("#menu .item[data-view]");
        for (var m = 0; m < menuButtons.length; m++) {
            menuButtons[m].onclick = function () {
                var view = this.getAttribute("data-view");
                closeMenu();
                setView(view);
            };
        }

        // ---------- One-Tap Fast Upload Flow with Thumbnail Generator ----------
        function triggerUpload() {
            closeMenu();
            $("autoFileInput").click();
        }

        $("fabUpload").onclick = triggerUpload;
        $("menuUploadBtn").onclick = triggerUpload;

        function showToast(msg) {
            var t = $("toast");
            t.textContent = msg;
            t.classList.add("show");
        }

        function hideToast() {
            $("toast").classList.remove("show");
        }

        $("autoFileInput").onchange = async function () {
            var files = this.files;
            if (files.length === 0) return;

            var validFiles = [];
            for (var i = 0; i < files.length; i++) {
                var isVideo = files[i].type.indexOf("video/") === 0;
                var isImage = files[i].type.indexOf("image/") === 0;
                if (isVideo || isImage) validFiles.push(files[i]);
            }

            if (validFiles.length === 0) {
                showToast("No supported photos or videos found.");
                setTimeout(hideToast, 2500);
                return;
            }

            showToast(validFiles.length === 1 ? "Adding memory..." : "Adding " + validFiles.length + " memories...");

            for (var i = 0; i < validFiles.length; i++) {
                var f = validFiles[i];
                var isVideo = f.type.indexOf("video/") === 0;
                var thumbnailData = null;

                if (isVideo) {
                    thumbnailData = await new Promise(function (resolve) {
                        var videoUrl = URL.createObjectURL(f);
                        var videoElement = document.createElement("video");
                        videoElement.muted = true;
                        videoElement.src = videoUrl;

                        videoElement.onloadedmetadata = function () {
                            videoElement.currentTime = 0.5;
                        };

                        videoElement.onseeked = function () {
                            var canvas = document.createElement("canvas");
                            canvas.width = videoElement.videoWidth;
                            canvas.height = videoElement.videoHeight;
                            var ctx = canvas.getContext("2d");
                            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL("image/jpeg", 0.5));
                            URL.revokeObjectURL(videoUrl);
                        };

                        videoElement.onerror = function () {
                            resolve(null);
                            URL.revokeObjectURL(videoUrl);
                        };
                    });
                }

                var item = {
                    id: Date.now() + "-" + Math.floor(Math.random() * 100000),
                    title: f.name.replace(/\.[^.]+$/, ""),
                    type: isVideo ? "video" : "image",
                    featured: false,
                    date: Date.now() + i,
                    blob: f,
                    thumbnail: thumbnailData
                };

                await new Promise(function (resolve) { saveItem(item, resolve); });
            }

            $("autoFileInput").value = "";
            loadItems();
            showToast("Done!");
            setTimeout(hideToast, 2500);
        };

        // ---------- Lightbox ----------
        function openLightbox(id) {
            lbIndex = 0;
            for (var i = 0; i < shown.length; i++) {
                if (shown[i].id === id) lbIndex = i;
            }
            showLightboxItem();
            $("lightbox").classList.remove("hidden");
        }

        function showLightboxItem() {
            var item = shown[lbIndex];
            var box = $("lbContent");
            box.innerHTML = "";

            var el;
            if (item.type === "video") {
                el = document.createElement("video");
                el.controls = true;
                el.autoplay = true;
            } else {
                el = document.createElement("img");
            }
            el.src = item.url;
            box.appendChild(el);
            $("lbTitle").textContent = item.title;
        }

        function closeLightbox() {
            $("lightbox").classList.add("hidden");
            setTimeout(function () {
                $("lbContent").innerHTML = "";
            }, 400);
        }

        function moveLightbox(step) {
            if (shown.length === 0) return;
            lbIndex = (lbIndex + step + shown.length) % shown.length;
            showLightboxItem();
        }

        $("lbClose").onclick = closeLightbox;
        $("lbPrev").onclick = function () { moveLightbox(-1); };
        $("lbNext").onclick = function () { moveLightbox(1); };

        document.onkeydown = function (e) {
            if ($("lightbox").classList.contains("hidden")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowLeft") moveLightbox(-1);
            if (e.key === "ArrowRight") moveLightbox(1);
        };

        // ---------- Start ----------
        openDB(function () {
            loadItems(true);
        });
    </script>
</body>
